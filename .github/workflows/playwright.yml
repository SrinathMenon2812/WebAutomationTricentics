name: Playwright Tests
run-name: Waymark run ${{ inputs.run_id || github.run_id }}

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Waymark run id
        required: false
        type: string
      test_case_ids:
        description: Comma-separated ADO test case IDs (empty = run everything)
        required: false
        type: string

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npx playwright install --with-deps
      - name: Run Playwright tests
        env:
          TEST_CASE_IDS: ${{ inputs.test_case_ids }}
          PLAYWRIGHT_JSON_OUTPUT_NAME: results.json
        run: |
          if [ -n "$TEST_CASE_IDS" ]; then
            ARGS=()
            IFS=',' read -ra IDS <<< "$(echo "$TEST_CASE_IDS" | tr -d ' ')"
            for id in "${IDS[@]}"; do
              [[ "$id" =~ ^[0-9]+$ ]] || { echo "Invalid test case id: $id"; exit 1; }
              ARGS+=("TC ${id}\\.spec\\.ts")
            done
            npx playwright test "${ARGS[@]}" --reporter=list,json,html
          else
            npx playwright test --reporter=list,json,html
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-results
          path: |
            results.json
            playwright-report/
