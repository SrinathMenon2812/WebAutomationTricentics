- name: Run Playwright tests
        env:
          TEST_CASE_IDS: ${{ inputs.test_case_ids }}
          PLAYWRIGHT_JSON_OUTPUT_NAME: results.json
        run: |
          if [ -n "$TEST_CASE_IDS" ]; then
            ARGS=()
            IFS=',' read -ra IDS <<< "$(echo "$TEST_CASE_IDS" | tr -d ' ')"
            for id in "${IDS[@]}"; do
              [[ "$id" =~ ^[0-9]+$ ]] || { echo "Invalid test case id: $id"; exit 1; }
              ARGS+=("TC ${id}\\.spec\\.ts")
            done
            npx playwright test "${ARGS[@]}" --reporter=list,json,html
          else
            npx playwright test --reporter=list,json,html
          fi
